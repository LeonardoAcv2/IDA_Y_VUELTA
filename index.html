<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ida y Vuelta</title>
  <meta name="description" content="Exposición Ida y Vuelta: animación, mapa interactivo y experiencia de realidad aumentada.">
  <style>
    :root {
      --bg: #111;
      --fg: #f4f1ea;
      --accent: #e0a33a;
      --card: #1c1c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    section { padding: 2rem 1rem; max-width: 960px; margin: 0 auto; }
    h2 { margin-bottom: 1rem; font-weight: normal; letter-spacing: .05em; }

    /* Banner del museo + nombre de la exposición */
    .banner { text-align: center; padding-top: 0; }
    .banner img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
    .banner h1 { margin-top: 1.5rem; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: .08em; }
    .banner p { opacity: .75; }

    /* Video de YouTube con vista previa (carga el iframe al hacer clic) */
    .video { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; cursor: pointer; }
    .video img, .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
    .video button {
      position: absolute; inset: 0; margin: auto; width: 72px; height: 72px;
      border-radius: 50%; border: 0; background: var(--accent); color: #000; font-size: 1.8rem; cursor: pointer;
    }

    /* Mapa interactivo */
    .mapa { height: 380px; background: var(--card); border-radius: 12px; overflow: hidden; }
    .mapa iframe { width: 100%; height: 100%; border: 0; }

    /* Botón de realidad aumentada */
    .ra { text-align: center; }
    .ra a {
      display: inline-block; padding: 1rem 2.5rem; border-radius: 999px;
      background: var(--accent); color: #000; text-decoration: none;
      font-size: 1.2rem; font-weight: bold;
    }
    .ra a:active { transform: scale(.97); }

    footer { text-align: center; padding: 2rem 1rem; opacity: .6; font-size: .85rem; }
  </style>
</head>
<body>

  <!-- 1. Banner del museo + nombre de la exposición -->
  <header class="banner">
    <img src="img/banner.jpg" alt="Banner del museo">
    <h1>Ida y Vuelta</h1>
    <p>Exposición · Nombre del museo</p>
  </header>

  <main>
    <!-- 2. Video de YouTube con vista previa -->
    <section>
      <h2>Animación</h2>
      <div class="video" id="video" role="button" aria-label="Reproducir video">
        <img src="https://img.youtube.com/vi/-T5RF03tQYI/maxresdefault.jpg" alt="Vista previa de la animación">
        <button type="button" aria-hidden="true">▶</button>
      </div>
    </section>

    <!-- 3. Mapa interactivo (reemplaza el src por tu mapa) -->
    <section>
      <h2>Mapa</h2>
      <div class="mapa">
        <iframe
          src="https://www.google.com/maps?q=Teziutl%C3%A1n,+Puebla&output=embed"
          loading="lazy"
          title="Mapa de la exposición"></iframe>
      </div>
    </section>

    <!-- 4. Botón hacia la experiencia de realidad aumentada (/ra) -->
    <section class="ra">
      <h2>Realidad aumentada</h2>
      <a href="/ra/">Iniciar experiencia AR</a>
    </section>
  </main>

  <footer>Ida y Vuelta</footer>

  <script>
    // Carga el iframe de YouTube solo al hacer clic en la vista previa
    document.getElementById('video').addEventListener('click', function () {
      this.innerHTML =
        '<iframe src="https://www.youtube.com/embed/-T5RF03tQYI?autoplay=1" ' +
        'allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    }, { once: true });
  </script>
</body>
</html>
